name: reelsgate-roxx

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: reelsgate_roxx_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-reelsgate_roxx_db}
      MYSQL_USER: ${DB_USERNAME:-reelsgate_roxx_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root_password}
    ports:
      - "${DB_HOST_PORT:-3308}:3306"
    volumes:
      - reelsgate_roxx_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_PASSWORD:-root_password}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reelsgate_roxx_network

  # Database Management GUI (Adminer)
  adminer:
    image: adminer:latest
    container_name: reelsgate_roxx_adminer
    restart: always
    ports:
      - "${ADMINER_PORT:-8083}:8080"
    depends_on:
      - mysql
    networks:
      - reelsgate_roxx_network

  # Redis Cache & Queue Service
  redis:
    image: redis:7.2-alpine
    container_name: reelsgate_roxx_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6381}:6379"
    networks:
      - reelsgate_roxx_network

  # Local S3 Storage (MinIO)
  minio:
    image: minio/minio:latest
    container_name: reelsgate_roxx_minio
    restart: always
    ports:
      - "${MINIO_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadminpassword}
    command: server /data --console-address ":9001"
    volumes:
      - reelsgate_roxx_minio_data:/data
    networks:
      - reelsgate_roxx_network

  # NestJS Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: reelsgate_roxx_backend
    restart: always
    ports:
      - "${PORT:-8009}:8008"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8008
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-reelsgate_roxx_user}
      DB_USER: ${DB_USERNAME:-reelsgate_roxx_user}
      DB_PASSWORD: ${DB_PASSWORD:-root_password}
      DB_DATABASE: ${DB_DATABASE:-reelsgate_roxx_db}
      DB_NAME: ${DB_DATABASE:-reelsgate_roxx_db}
      DB_SYNCHRONIZE: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_CLIENT_ENDPOINT: http://localhost:9002
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadminpassword}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-reelsgate-roxx-reels}
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - reelsgate_roxx_network

  # React Admin Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reelsgate_roxx_frontend
    restart: always
    ports:
      - "${FRONTEND_DEV_PORT:-3001}:5173"
    environment:
      VITE_API_URL: http://localhost:${PORT:-8009}
      REACT_APP_API_URL: http://localhost:${PORT:-8009}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - reelsgate_roxx_network

networks:
  reelsgate_roxx_network:
    driver: bridge

volumes:
  reelsgate_roxx_mysql_data:
    driver: local
  reelsgate_roxx_minio_data:
    driver: local
